<!DOCTYPE html>
<html lang = "Pt-Br">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gerenciador de Produtos</title>
        <link rel="stylesheet" href="./style.css">
    </head>
    <body>
      

        <div class="container">
            <h1>Cadastro de Produtos</h1>
            
            <form id = "formProduto">
                <input type="hidden" id="produtoId">
                <input type="text" id="nomeProduto" placeholder="Nome do Produto" required>
                <input type="text" id="descricao" placeholder="Descrição" required>
                <input type="number" id="preco" step="0.01" placeholder="Preço ex: 19.90" required>
                <input type="number" id="quantidade" placeholder="Quantidade" required>
                <button type="submit" id="submitBtn">Salvar</button>
                <button type="button" id="cancelBtn" style="display:none;">Cancelar</button>
            </form>
			
            <hr>
			
        <h2>Lista de produtos</h2>
        <button type="button" id="listarBtn" onclick = "carregarProdutos()"> Listar Produtos</button>
        <ul id ="listaProdutos"></ul> 
    </div>
	
	<script src="./produtos.js"></script>
    
    </body>
</html>
