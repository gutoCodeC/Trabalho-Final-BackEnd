<!-- Script para carregar dinamicamente o nome do usuário logado -->
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const usuarioSalvo = localStorage.getItem("usuarioLogado");

        if (usuarioSalvo) {
            const usuario = JSON.parse(usuarioSalvo);

            const nomeEl = document.getElementById("usuarioNome");
            const emailEl = document.getElementById("usuarioEmail");

            if (nomeEl && usuario.nome) {
                nomeEl.textContent = usuario.nome;
            }
            if (emailEl && usuario.email) {
                emailEl.textContent = usuario.email;
            }
        }
    });
</script>
</body>
</html>
